<style>
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{font-family:Arial,sans-serif;color:white;background:#080d20;overflow-x:hidden}
.background{position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 15% 20%,#126b82,transparent 35%),radial-gradient(circle at 85% 75%,#6335a0,transparent 40%),linear-gradient(135deg,#070b1d,#14264d,#241238);animation:colors 10s infinite alternate}
@keyframes colors{from{filter:hue-rotate(0deg)}to{filter:hue-rotate(55deg)}}
header{padding:22px;text-align:center;background:rgba(0,0,0,.25);border-bottom:1px solid #ffffff22;position:sticky;top:0;z-index:10;backdrop-filter:blur(15px)}
header h2{color:#8ff3e6;letter-spacing:2px}nav{margin-top:15px;display:flex;justify-content:center;flex-wrap:wrap;gap:18px}nav a{color:white;text-decoration:none;transition:.3s}nav a:hover{color:#ffd477}
section{padding:65px 20px;text-align:center;scroll-margin-top:110px}.hero{min-height:85vh;display:flex;justify-content:center;align-items:center}
.card{width:100%;max-width:850px;padding:45px 25px;background:rgba(255,255,255,.09);border:1px solid #ffffff33;border-radius:30px;backdrop-filter:blur(15px);box-shadow:0 20px 60px #0006;animation:appear 1.5s ease}
@keyframes appear{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
.teacher-photo{width:min(360px,85%);margin:0 auto 22px;animation:float 4s ease-in-out infinite}.teacher-photo img{width:100%;display:block;border-radius:24px;border:3px solid #8ff3e6;box-shadow:0 0 30px #8ff3e655;object-fit:cover}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.book{font-size:70px;margin-bottom:15px}h1{font-size:clamp(30px,7vw,55px);margin:15px 0;background:linear-gradient(90deg,#fff,#75eee1,#c6a7ff);-webkit-background-clip:text;background-clip:text;color:transparent;direction:ltr}h2{color:#ffd477;margin-bottom:20px}p{font-size:19px;line-height:2;color:#e3eaff}
.subtitle{direction:ltr;color:#8ff3e6;font-weight:bold;margin:25px;letter-spacing:2px}.button{display:inline-block;padding:14px 28px;margin:10px;border-radius:40px;text-decoration:none;font-weight:bold;color:#10172d;background:linear-gradient(90deg,#8df2e5,#f6d27c);transition:.3s;border:none;cursor:pointer}.button:hover{transform:translateY(-5px) scale(1.04)}.whatsapp{background:#25d366;color:white}
.features{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:30px}.features span{padding:14px;background:#ffffff18;border:1px solid #ffffff22;border-radius:15px}
.section-title{font-size:35px;margin-bottom:30px;color:#8ff3e6}.courses{max-width:1000px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}.course{background:#ffffff12;border:1px solid #ffffff30;border-radius:20px;padding:30px 20px;transition:.4s}.course:hover{transform:translateY(-10px);background:#ffffff25}.course .emoji{font-size:45px;margin-bottom:15px}
.form-box{max-width:550px;margin:auto;padding:30px;background:#ffffff12;border:1px solid #ffffff33;border-radius:25px}input,select{width:100%;padding:15px;margin:10px 0;border:1px solid #ffffff44;border-radius:12px;background:#101b36;color:white;font-size:16px;outline:none}input:focus,select:focus{border-color:#8df2e5}select option{background:#101b36;color:white}.form-box button{width:100%;font-size:17px}
footer{padding:35px 15px;text-align:center;background:#0005;color:#bbc8e5;line-height:2}.music-note{position:fixed;left:15px;bottom:15px;color:#8df2e5;background:#10172d;border:1px solid #8df2e5;padding:10px 15px;border-radius:20px;font-size:13px;z-index:20}
@media(max-width:600px){nav{gap:12px}nav a{font-size:14px}section{padding:45px 15px}.card{padding:35px 18px}.teacher-photo{width:min(300px,90%)}}
</style>
